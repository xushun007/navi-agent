[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navi-agent"
version = "0.3.0"
description = "A self-improving agent inspired by Hermes Agent."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "xushun007" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "ddgs>=9.14.4",
    "langfuse>=2.60.8",
    "openai>=3.1.0",
    "prompt-toolkit>=3.0.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
navi-agent = "navi_agent.cli.main:main"

[project.urls]
Documentation = "https://www.agent-io.com/navi-agent/"
Issues = "https://github.com/xushun007/navi-agent/issues"
Repository = "https://github.com/xushun007/navi-agent"

[project.optional-dependencies]
mcp = [
    "httpx2>=2.12,<3",
    "mcp>=2.0,<3",
]
eval = [
    "inspect-ai>=0.3.249",
]
swe-bench = [
    "inspect-ai>=0.3.249",
    "inspect-evals[swe-bench]>=0.16.0",
    "inspect-sandboxes>=0.6.0",
    "modal[api-proxy-support]>=1.5.3",
]
terminal-bench = [
    "inspect-ai>=0.3.249",
    "inspect-harbor>=0.5",
    "inspect-sandboxes>=0.6.0",
    "modal[api-proxy-support]>=1.5.3",
]
deep-swe = [
    "datacurve-pier>=0.3.1",
]
[dependency-groups]
dev = [
    "inspect-ai>=0.3.249",
    "pytest>=8.0.0",
]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocs-static-i18n>=1.3,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/navi_agent", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
