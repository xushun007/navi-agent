site_name: Navi Agent
site_description: Documentation for the Navi Agent runtime and CLI
site_url: https://xushun007.github.io/navi-agent/
repo_url: https://github.com/xushun007/navi-agent
repo_name: xushun007/navi-agent

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Usage:
      - CLI: cli.md
      - Slash Commands: commands.md
      - Tools: tools.md
      - Permissions: permissions.md
      - Sessions and Memory: sessions-and-memory.md
      - Skill Evaluation: skill-evaluation.md
      - Local Trace Viewer: trace-viewer.md
  - Gateway: gateway.md
  - Configuration: configuration.md
  - Architecture: architecture.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_description: Navi Agent 运行时与 CLI 文档
          nav_translations:
            Overview: 概览
            Getting Started: 快速开始
            Usage: 使用
            CLI: 命令行
            Slash Commands: Slash 命令
            Tools: 工具
            Permissions: 权限
            Sessions and Memory: 会话与记忆
            Skill Evaluation: Skill 评测
            Local Trace Viewer: 本地 Trace Viewer
            Gateway: 网关
            Configuration: 配置
            Architecture: 架构

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

strict: true
