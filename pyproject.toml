[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navi-agent"
version = "0.1.0"
description = "A self-improving agent inspired by Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.249",
    "langfuse>=2.60.8",
    "openai>=2.45.0",
    "prompt-toolkit>=3.0.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
navi-agent = "navi_agent.cli.main:main"

[project.optional-dependencies]
swe-bench = [
    "inspect-evals[swe-bench]>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/navi_agent", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
